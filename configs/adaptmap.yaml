# AdaptMap configuration. Distances in metres, times in seconds.

device: cuda

preprocess:
  min_range: 0.5          # drop self-hits / near-field noise
  max_range: 100.0        # sensor + map limit
  z_min: -3.0             # ROI height window relative to sensor
  z_max: 5.0
  self_box: [-0.6, 0.6, -0.45, 0.45, -2.0, 0.3]   # robot body box in sensor frame (xmin,xmax,ymin,ymax,zmin,zmax)
  outlier_voxel: 0.4      # voxel size for isolation filter
  outlier_min_pts: 2      # voxels with fewer points (and no neighbours) are dropped
  constant_intensity: 0.25  # sim intensity is unrealistic; feed the model a dataset-like mean
  adaptive_downsample: false  # compute-side foveation before segmentation

# Foveated zones: nested squares around the robot (Chebyshev distance).
# Each zone's cell size ~ HDL-64 horizontal point spacing at its outer edge.
zones:
# fill_radius: how far (m) ground may be interpolated across a hole between LiDAR rings; grows with
# distance because ring spacing grows (~0.4 m at 10 m, 1.6 m at 20 m, 3.6 m at 30 m).
  - {name: near, half_extent: 10.0,  cell: 0.05, fill_radius: 0.3}
  - {name: high, half_extent: 30.0,  cell: 0.10, fill_radius: 1.0}
  - {name: mid,  half_extent: 50.0,  cell: 0.25, fill_radius: 2.0}
  - {name: far,  half_extent: 100.0, cell: 0.50, fill_radius: 3.0}

fusion:
  tau_static: 20.0        # weight time-constant for static classes
  tau_dynamic: 0.5        # vehicles / pedestrians fade fast -> no ghost trails
  max_weight: 10.0        # cap so the map stays responsive
  min_weight: 0.05        # below this a cell is considered unknown
  conf_support: 3.0       # observations needed for full confidence
  ground_radius: 2.0      # interpolate ground under objects from ground cells within this radius
  # ray clearing: rays that pass through a stored obstacle (above its bottom, below its top) clear it
  ray_clearing: true
  clear_ray_stride: 8     # use every 8th point as a ray
  clear_samples: 32       # samples per ray
  clear_range: 50.0       # only rays up to this length
  clear_margin: 0.2       # ray must be this far inside the obstacle span (m)
  clear_end_margin: 0.3   # ignore samples this close to the ray's end point (m)
  clear_min_hits: 1
  clear_factor: 0.5       # weight multiplier per scan for contradicted cells

# Speed-adaptive foveation (adaptmap/adaptive.py): the 5 cm zone grows with reaction + braking distance
adaptive_zones:
  enabled: true
  reaction_time: 1.0      # s
  decel: 2.0              # comfortable braking, m/s^2
  margin: 4.0             # m
  max_near: 25.0          # m (must stay inside the next zone)
  shrink_delay: 3.0       # s the target must stay smaller before the zone shrinks

# Terrain analysis / traversability (adaptmap/terrain.py), limits of the rover
terrain:
  costmap_cell: 0.2       # navigation grid resolution (m)
  costmap_half: 50.0      # navigation grid half-size (m)
  robot_height: 1.0       # can drive under overhangs with more clearance than this (m)
  max_step: 0.12          # highest step the wheels can climb (m); 0.15 m curbs are not climbable
  max_slope_deg: 20.0
  curb_min: 0.05          # a road<->sidewalk height jump in this range is a curb (m)
  curb_max: 0.30
  curb_lethal: true
  slope_window: 0.6       # (m) windows for smoothing / neighbourhoods
  step_window: 0.2
  rough_window: 0.4
  rough_max: 0.10         # roughness (std, m) that earns the full rough_cost
  slope_cost: 40
  rough_cost: 20
  filled_cost: 10         # interpolated (hole-filled) cells are less certain
  class_cost: {road: 0, sidewalk_curb: 30, terrain: 20, vegetation: 60, unknown: 50}

model:
  backend: mmdet3d_minkunet   # mmdet3d_minkunet | geometric
  config: checkpoints/minkunet.py
  checkpoint: checkpoints/minkunet.pth
  half: true               # fp16 inference: ~2.4x faster, 99.95 % identical labels
